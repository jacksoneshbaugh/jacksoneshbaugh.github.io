- id: fr-idioms
  title: "Thesis: Detecting French Idioms"
  dates: "Feb 2025 – present"
  advisors:
    - { name: "Sofia Serrano", url: "https://sites.lafayette.edu/serranos/" }
  status: active
  summary: >
    My honors thesis will investigate how theoretical accounts of idiomatic language can be translated into computational models. Using a new French idiom corpus, I will explore how linguistic dimensions of idiomaticity—such as semantic opacity, syntactic flexibility, and conventionality—can be operationalized for natural language processing.
  tags: [ computational, linguistics, nlp, multilingual, idioms ]
  links: [ ]

- id: fr-idioms-saussure
  title: "Aller de soi : les idioms face au modèle saussurien [Taking it for Granted: Idioms verses the Saussureian Model]"
  dates: "Jan. 2026 – May 2026"
  advisors:
    - { name: "Maria Hernandez", url: "https://lls.lafayette.edu/people/maria-hernandez/" }
  status: inactive
  summary: >
    This independent study in the French program examines idiomatic language through the lens of modern linguistic theory. Focusing on French idioms, I analyze the limitations of Saussure's structural model in explaining idiomatic meaning and explore how more recent linguistic frameworks provide a foundation for future computational models of idiomaticity.
  tags: [ linguistics, idioms, French ]
  links:
    - { label: "Final Product (in French)", url: "/uploads/files/aller-de-soi.pdf" }
    - { label: "Final Product (Machine Translated)", url: "/uploads/files/taking-it-for-granted.pdf" }